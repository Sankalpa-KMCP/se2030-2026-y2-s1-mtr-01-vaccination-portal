openapi: 3.0.3
info:
  title: WBVP MF-03 Appointment, Waitlist and Check-In API
  version: appointment-H
  description: Source-derived MF-03 contract. Citizen identity comes from the JWT; a supplied citizenId may only match that identity.
security:
  - bearerAuth: []
paths:
  /api/v1/appointments/mine:
    get:
      tags: [Appointments]
      responses:
        '200': { description: Citizen appointment history, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AppointmentResponse' } } } } }
  /api/v1/appointments/search:
    get:
      tags: [Appointments]
      parameters:
        - { name: campaignId, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: centerId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: fromDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: toDate, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Bookable slots, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AvailableSessionResponse' } } } } }
  /api/v1/appointments/book:
    post:
      tags: [Appointments]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentBookingRequest' } } } }
      responses:
        '201': { description: Booked, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentResponse' } } } }
        '409': { $ref: '#/components/responses/BusinessError' }
  /api/v1/appointments/{id}/cancel:
    post:
      tags: [Appointments]
      parameters: [{ $ref: '#/components/parameters/AppointmentId' }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentCancellationRequest' } } } }
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentResponse' } } } }
        '409': { $ref: '#/components/responses/BusinessError' }
  /api/v1/appointments/{id}/reschedule:
    post:
      tags: [Appointments]
      parameters: [{ $ref: '#/components/parameters/AppointmentId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentRescheduleRequest' } } } }
      responses:
        '200': { description: Rescheduled, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentResponse' } } } }
        '409': { $ref: '#/components/responses/BusinessError' }
  /api/v1/appointments/{id}/check-in:
    post:
      tags: [Check-In]
      parameters: [{ $ref: '#/components/parameters/AppointmentId' }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/CheckInRequest' } } } }
      responses:
        '200': { description: Checked in, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentResponse' } } } }
  /api/v1/appointments/{id}/reverse-check-in:
    post:
      tags: [Check-In]
      parameters: [{ $ref: '#/components/parameters/AppointmentId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckInReversalRequest' } } } }
      responses:
        '200': { description: Reverted to confirmed, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentResponse' } } } }
  /api/v1/appointments/{id}/no-show:
    post:
      tags: [Check-In]
      parameters: [{ $ref: '#/components/parameters/AppointmentId' }]
      responses:
        '200': { description: Marked no-show, content: { application/json: { schema: { $ref: '#/components/schemas/AppointmentResponse' } } } }
  /api/v1/appointments/queue:
    get:
      tags: [Check-In]
      parameters:
        - { name: slotId, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Center-scoped queue, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AppointmentResponse' } } } } }
  /api/v1/waitlist/join:
    post:
      tags: [Waitlist]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WaitlistJoinRequest' } } } }
      responses:
        '201': { description: Joined, content: { application/json: { schema: { $ref: '#/components/schemas/WaitlistEntryResponse' } } } }
  /api/v1/waitlist/{id}/leave:
    post:
      tags: [Waitlist]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Left waitlist, content: { application/json: { schema: { $ref: '#/components/schemas/WaitlistEntryResponse' } } } }
  /api/v1/waitlist/status:
    get:
      tags: [Waitlist]
      parameters:
        - { name: campaignId, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { description: Citizen waitlist state and position, content: { application/json: { schema: { $ref: '#/components/schemas/WaitlistEntryResponse' } } } }
        '404': { description: No matching entry }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    AppointmentId: { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
  responses:
    BusinessError:
      description: Validation, authorization, state, ownership or capacity rejection
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    AppointmentBookingRequest:
      type: object
      required: [citizenId, campaignId, slotId]
      properties: { citizenId: { type: integer, format: int64 }, campaignId: { type: integer, format: int64 }, slotId: { type: integer, format: int64 } }
    AppointmentCancellationRequest:
      type: object
      properties: { requestingCitizenId: { type: integer, format: int64 }, isStaffOverride: { type: boolean }, staffReason: { type: string, maxLength: 500 } }
    AppointmentRescheduleRequest:
      type: object
      required: [newSlotId]
      properties: { requestingCitizenId: { type: integer, format: int64 }, newSlotId: { type: integer, format: int64 }, isStaffOverride: { type: boolean }, staffReason: { type: string, maxLength: 500 } }
    CheckInRequest:
      type: object
      properties: { isStaffOverride: { type: boolean }, staffReason: { type: string, maxLength: 500 } }
    CheckInReversalRequest:
      type: object
      required: [reason]
      properties: { reason: { type: string, minLength: 1, maxLength: 500 } }
    WaitlistJoinRequest:
      type: object
      required: [citizenId, campaignId, sessionId]
      properties: { citizenId: { type: integer, format: int64 }, campaignId: { type: integer, format: int64 }, sessionId: { type: integer, format: int64 } }
    AppointmentResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        citizenId: { type: integer, format: int64 }
        campaignId: { type: integer, format: int64 }
        slotId: { type: integer, format: int64 }
        status: { type: string, enum: [CONFIRMED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW] }
        bookedAt: { type: string, format: date-time }
        cancelledAt: { type: string, format: date-time, nullable: true }
        lockVersion: { type: integer, format: int64 }
    WaitlistEntryResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        citizenId: { type: integer, format: int64 }
        campaignId: { type: integer, format: int64 }
        sessionId: { type: integer, format: int64 }
        status: { type: string, enum: [WAITING, PROMOTED, SKIPPED_INELIGIBLE, SKIPPED_DUPLICATE_APPOINTMENT, SKIPPED_MALFORMED, CANCELLED, SESSION_CANCELLED, EXPIRED] }
        joinedAt: { type: string, format: date-time }
        lockVersion: { type: integer, format: int64 }
        position: { type: integer, nullable: true, minimum: 1 }
    AvailableSessionResponse:
      type: object
      properties:
        sessionId: { type: integer, format: int64 }
        slotId: { type: integer, format: int64 }
        campaignId: { type: integer, format: int64 }
        centerId: { type: integer, format: int64 }
        centerName: { type: string }
        centerAddress: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        bookingCloseAt: { type: string, format: date-time }
        remainingCapacity: { type: integer, minimum: 0 }
    ErrorResponse:
      type: object
      properties: { status: { type: integer }, error: { type: string }, message: { type: string }, timestamp: { type: string, format: date-time } }
