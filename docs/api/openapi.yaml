openapi: 3.0.3
info:
  title: WBVP current shared-auth contract
  version: develop-444364d
  description: Source-derived ten AuthController operations at 444364d4b742fa08455c4acf0538baa836e9529a.
    Other domain and OTP controller DTO schemas are intentionally omitted; see current-endpoints.md.
    No hosting server is asserted.
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - Shared authentication
      security: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          headers:
            Set-Cookie:
              description: HttpOnly refresh cookie; SameSite=Lax; Path=/api/v1/auth;
                Secure default. Seven-day Max-Age on issue; Max-Age=0 on logout. Name
                is configurable.
              schema:
                type: string
        '400':
          description: Authentication, state or input rejection; see exception handler
            and controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '401':
          description: Authentication, state or input rejection; see exception handler
            and controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: Authentication, state or input rejection; see exception handler
            and controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '423':
          description: Authentication, state or input rejection; see exception handler
            and controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      tags:
      - Shared authentication
      security:
      - refreshCookie: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          headers:
            Set-Cookie:
              description: HttpOnly refresh cookie; SameSite=Lax; Path=/api/v1/auth;
                Secure default. Seven-day Max-Age on issue; Max-Age=0 on logout. Name
                is configurable.
              schema:
                type: string
        '401':
          description: Authentication, state or input rejection; see exception handler
            and controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: Authentication, state or input rejection; see exception handler
            and controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '423':
          description: Authentication, state or input rejection; see exception handler
            and controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
      description: No JSON body. Consumes and rotates refresh cookie. Reuse revokes
        its family. Client must enforce established principal continuity before installing
        access token. Definitive authentication failure clears cookie.
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - Shared authentication
      security: []
      responses:
        '204':
          description: Successful response
          headers:
            Set-Cookie:
              description: HttpOnly refresh cookie; SameSite=Lax; Path=/api/v1/auth;
                Secure default. Seven-day Max-Age on issue; Max-Age=0 on logout. Name
                is configurable.
              schema:
                type: string
      description: Idempotent with missing/invalid cookie; optionally sends the browser
        refresh cookie to revoke the current family.
  /api/v1/auth/register/citizen:
    post:
      operationId: register_citizen
      tags:
      - Shared authentication
      security: []
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: Authentication, state or input rejection; see exception handler
