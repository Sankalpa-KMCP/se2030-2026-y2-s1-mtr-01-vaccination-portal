          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '409':
          description: Authentication, state or input rejection; see exception handler
            and controller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenRegistrationRequest'
