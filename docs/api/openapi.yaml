  /api/v1/auth/me:
    get:
      operationId: me
      tags:
      - Shared authentication
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Authentication, state or input rejection; see exception handler
            and controller.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 15-minute access token, memory only.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Default configurable HttpOnly cookie name. Browser-managed; opaque
        value never available to frontend JS. Seven days; Secure default.
  schemas:
    LoginRequest:
      type: object
      properties:
        email: &id001
          type: string
          format: email
          maxLength: 255
          minLength: 1
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
      required:
      - email
      - password
    UserProfileResponse:
      type: object
      properties:
        id: &id002
          type: integer
          format: int64
        fullName: &id003
          type: string
        email: &id004
          type: string
          format: email
        phoneNumber: &id005
          type: string
          nullable: true
        accountStatus: &id006
          type: string
          enum:
          - ACTIVE
          - PENDING_VERIFICATION
          - PENDING_APPROVAL
          - REJECTED
          - LOCKED
          - SUSPENDED
        roles: &id007
          type: array
          items:
            type: string
      required:
      - id
      - fullName
      - email
      - accountStatus
      - roles
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Short-lived access JWT; retain only in memory.
        user:
          $ref: '#/components/schemas/UserProfileResponse'
      required:
      - token
      - user
    CitizenRegistrationRequest:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 255
        email: *id001
        phoneNumber:
          type: string
          pattern: ^[0-9]{10}$
        password: &id008
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
      required:
      - fullName
      - email
      - phoneNumber
      - password
    StaffRegistrationRequest:
      allOf:
      - $ref: '#/components/schemas/CitizenRegistrationRequest'
      - type: object
        properties:
          requestedRoleCode:
            type: string
            minLength: 1
            maxLength: 64
        required:
        - requestedRoleCode
    RegistrationResponse:
      type: object
      properties:
        id: *id002
        fullName: *id003
        email: *id004
        phoneNumber: *id005
        accountStatus: *id006
        roles: *id007
        requestedRoleCode:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - token
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          writeOnly: true
        newPassword: *id008
      required:
      - token
      - newPassword
    EmailRequest:
      type: object
      properties:
        email: *id001
      required:
      - email
    AuthErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        code:
          type: string
        message:
          type: string
        path:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        retryAfterSeconds:
          type: integer
          format: int32
          nullable: true
