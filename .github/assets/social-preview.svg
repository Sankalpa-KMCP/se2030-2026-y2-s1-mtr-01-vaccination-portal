<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="45%" stop-color="#0f3e36"/>
      <stop offset="100%" stop-color="#062e26"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F6E5B"/>
      <stop offset="100%" stop-color="#14836d"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="cardShadow" x="-10" y="-10" width="1300" height="660" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>

  <!-- Subtle Decorative Geometric Elements -->
  <circle cx="1180" cy="80" r="280" stroke="#138771" stroke-width="1.5" stroke-opacity="0.15" fill="none"/>
  <circle cx="1180" cy="80" r="200" stroke="#138771" stroke-width="1" stroke-opacity="0.12" fill="none"/>
  <circle cx="1180" cy="80" r="120" stroke="#138771" stroke-width="1" stroke-opacity="0.10" fill="none"/>
  <circle cx="80" cy="560" r="220" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.10" fill="none"/>

  <!-- Center Card Area -->
  <rect x="70" y="60" width="1140" height="520" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Brand Mark Icon Shield (Scaled Vector) -->
  <g transform="translate(120, 110) scale(1.15)">
    <!-- Shield Outline & Body -->
    <path d="M64 8C79 18 96 21 112 24V61C112 88 91 108 64 120C37 108 16 88 16 61V24C32 21 49 18 64 8Z" fill="#0F6E5B"/>
    <path d="M64 18C77 26 90 29 102 32V61C102 82 86 99 64 110" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Syringe Graphic -->
    <g transform="rotate(42 64 60)">
      <path d="M58 31V40M70 31V40M53 30H75" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="54" y="41" width="20" height="37" rx="4" fill="#FFFFFF"/>
      <path d="M64 78V94" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <path d="M66 50H72M66 59H72M66 68H72" stroke="#0F6E5B" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M49 41H79" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- Protection Check Badge -->
    <circle cx="91" cy="88" r="18" fill="#D1FAE5" stroke="#0F6E5B" stroke-width="5"/>
    <path d="M83 88L89 94L100 82" stroke="#0F6E5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Eyebrow Pill -->
  <rect x="290" y="118" width="310" height="32" rx="16" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="445" y="139" fill="#FBBF24" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">ENTERPRISE HEALTHCARE PLATFORM</text>

  <!-- Main Title -->
  <text x="290" y="200" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">Web-Based Vaccination Portal</text>

  <!-- Subtitle -->
  <text x="290" y="246" fill="#94A3B8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="500">National-scale immunization orchestration with strict concurrency guarantees and verified health credentials.</text>

  <!-- Architectural Pillars List -->
  <g transform="translate(120, 310)">
    <!-- Pillar 1: Concurrency -->
    <rect x="0" y="0" width="320" height="90" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="36" cy="45" r="18" fill="#0F6E5B"/>
    <path d="M30 45L34 49L42 41" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="38" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="700">3-Level Pessimistic Locking</text>
    <text x="68" y="62" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Zero-oversell capacity assurance</text>

    <!-- Pillar 2: Security -->
    <rect x="350" y="0" width="320" height="90" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="386" cy="45" r="18" fill="#0F6E5B"/>
    <path d="M380 45L384 49L392 41" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="418" y="38" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="700">Zero-Trust Session Defense</text>
    <text x="418" y="62" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">In-memory JWTs &amp; rotating cookies</text>

    <!-- Pillar 3: Clinical & PDF -->
    <rect x="700" y="0" width="340" height="90" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="736" cy="45" r="18" fill="#0F6E5B"/>
    <path d="M730 45L734 49L742 41" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="768" y="38" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="700">Zero-Dependency PDF 1.4</text>
    <text x="768" y="62" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Pure Java cryptographic certificates</text>
  </g>

  <!-- Tech Stack Badges along Bottom -->
  <g transform="translate(120, 445)">
    <!-- Badge: Java 21 -->
    <rect x="0" y="0" width="135" height="42" rx="8" fill="#ED8B00" fill-opacity="0.2" stroke="#ED8B00" stroke-opacity="0.6"/>
    <text x="67" y="26" fill="#FDBA74" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">☕ Java 21</text>

    <!-- Badge: Spring Boot -->
    <rect x="150" y="0" width="165" height="42" rx="8" fill="#6DB33F" fill-opacity="0.2" stroke="#6DB33F" stroke-opacity="0.6"/>
    <text x="232" y="26" fill="#86EFAC" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🍃 Spring Boot</text>

    <!-- Badge: React 19 -->
    <rect x="330" y="0" width="145" height="42" rx="8" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-opacity="0.6"/>
    <text x="402" y="26" fill="#7DD3FC" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">⚛️ React 19</text>

    <!-- Badge: MySQL 8.4 LTS -->
    <rect x="490" y="0" width="170" height="42" rx="8" fill="#0284C7" fill-opacity="0.2" stroke="#0284C7" stroke-opacity="0.6"/>
    <text x="575" y="26" fill="#93C5FD" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🐬 MySQL 8.4 LTS</text>

    <!-- Badge: Flyway 28 Migrations -->
    <rect x="675" y="0" width="180" height="42" rx="8" fill="#DC2626" fill-opacity="0.2" stroke="#DC2626" stroke-opacity="0.6"/>
    <text x="765" y="26" fill="#FCA5A5" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🗄️ 28 Migrations</text>

    <!-- Badge: 4,200+ Tests -->
    <rect x="870" y="0" width="170" height="42" rx="8" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-opacity="0.6"/>
    <text x="955" y="26" fill="#6EE7B7" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">🧪 4,200+ Tests</text>
  </g>
</svg>
