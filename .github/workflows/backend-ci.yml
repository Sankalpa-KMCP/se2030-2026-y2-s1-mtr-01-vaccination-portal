name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend application (H2 test suite)
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify backend MySQL concurrency assurance (Testcontainers)
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify -Pmysql-concurrency
