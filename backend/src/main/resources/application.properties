# Spring Application Baseline Configuration
spring.application.name=vaccination-portal

# Server Port Configuration
server.port=${SERVER_PORT:8080}
# Reverse Proxy Forwarded Headers Strategy (Default: 'none' for direct deployment security)
# Set to 'framework' ONLY when deployed behind a trusted reverse proxy that sanitizes/overwrites X-Forwarded-For
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}

# MySQL Database DataSource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vaccination_portal}
spring.datasource.username=${DB_USERNAME:vaccination_app}
spring.datasource.password=${DB_PASSWORD:}

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Spring Boot Actuator Management Endpoints Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# JWT Authentication Security Configuration
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Optional first-administrator bootstrap (disabled unless all four environment variables are supplied)
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:}
app.bootstrap.admin.phone=${BOOTSTRAP_ADMIN_PHONE:}

# Optional initial super-administrator bootstrap (disabled unless all four environment variables are supplied)
app.bootstrap.super-admin.email=${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
app.bootstrap.super-admin.password=${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
app.bootstrap.super-admin.full-name=${BOOTSTRAP_SUPER_ADMIN_FULL_NAME:}
app.bootstrap.super-admin.phone=${BOOTSTRAP_SUPER_ADMIN_PHONE:}

# Authentication Action Tokens Configuration
app.security.auth.verification-token-expiration-hours=${AUTH_VERIFICATION_TOKEN_EXPIRATION_HOURS:24}
app.security.auth.reset-token-expiration-minutes=${AUTH_RESET_TOKEN_EXPIRATION_MINUTES:30}

# Bounded issuance cooldown for public forgot-password / resend-verification requests (R06).
# Per normalized-account-identity throttle; one key space covers both public link flows.
app.security.auth.link-issuance-cooldown-seconds=${AUTH_LINK_ISSUANCE_COOLDOWN_SECONDS:60}
app.auth.frontend-base-url=${AUTH_FRONTEND_BASE_URL:http://localhost:5173}

# Authentication Delivery Mode: smtp (default), console (evaluation), disabled (tests)
app.security.auth.delivery-mode=${AUTH_DELIVERY_MODE:smtp}
app.security.auth.mail-from=${MAIL_FROM:noreply@vaccinationportal.gov.lk}

# Spring Mail / SMTP Configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}

# Project-Wide AI Assistant Configuration (Phase 1)
app.ai.enabled=${AI_ASSISTANT_ENABLED:false}
app.ai.provider=${AI_ASSISTANT_PROVIDER:openai}
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.google-api-key=${GOOGLE_API_KEY:${GEMINI_API_KEY:}}
app.ai.model=${AI_ASSISTANT_MODEL:${OPENAI_MODEL:}}
app.ai.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.ai.timeout=${AI_ASSISTANT_TIMEOUT:15s}
app.ai.max-input-characters=${AI_ASSISTANT_MAX_INPUT_CHARACTERS:1500}
app.ai.max-history-messages=${AI_ASSISTANT_MAX_HISTORY_MESSAGES:10}
app.ai.max-output-tokens=${AI_ASSISTANT_MAX_OUTPUT_TOKENS:500}
app.ai.rate-limit.anonymous-per-minute=${AI_ASSISTANT_ANONYMOUS_RPM:5}
app.ai.rate-limit.authenticated-per-minute=${AI_ASSISTANT_AUTHENTICATED_RPM:15}
