# Spring Application Baseline Configuration
spring.application.name=vaccination-portal

# Server Port Configuration
server.port=${SERVER_PORT:8080}

# MySQL Database DataSource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vaccination_portal}
spring.datasource.username=${DB_USERNAME:vaccination_app}
spring.datasource.password=${DB_PASSWORD:}

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Spring Boot Actuator Management Endpoints Configuration
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT Authentication Security Configuration
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Optional first-administrator bootstrap (disabled unless all four environment variables are supplied)
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:}
app.bootstrap.admin.phone=${BOOTSTRAP_ADMIN_PHONE:}

# Optional initial super-administrator bootstrap (disabled unless all four environment variables are supplied)
app.bootstrap.super-admin.email=${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
app.bootstrap.super-admin.password=${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
app.bootstrap.super-admin.full-name=${BOOTSTRAP_SUPER_ADMIN_FULL_NAME:}
app.bootstrap.super-admin.phone=${BOOTSTRAP_SUPER_ADMIN_PHONE:}
