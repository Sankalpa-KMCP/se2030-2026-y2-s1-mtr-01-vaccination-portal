# Spring Boot Active Test Profile Configuration (In-Memory H2 with MySQL compatibility)
spring.datasource.url=jdbc:h2:mem:vaccination_portal_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Disable Flyway for In-Memory H2 Test Execution
spring.flyway.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT Test Configuration (Deterministic 256-bit test secret strictly for test execution)
app.security.jwt.secret=TestSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHmacSha256Security1234567890
app.security.jwt.expiration-minutes=60
